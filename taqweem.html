	function today() {
		var now = new Date();
		var start = new Date(now.getFullYear(), 0, 0);
		var diff = now - start;
		var oneDay = 1000 * 60 * 60 * 24;
		var day = Math.floor(diff / oneDay);
		day--;
		for (i = 1; i < 8; i++) { 
			document.getElementById("date"+i).src = dateLocation + date[day];
			document.getElementById("info"+i).src = InfoLocation + info[day];
			day++; if(day==365)day=0;
		}
		var owl = $("#owl-demo");
		owl.trigger('owl.goTo', 0)
	}
